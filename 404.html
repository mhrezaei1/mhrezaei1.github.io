<!-- Umami: no cookies, nothing rendered on the page, dashboard private.
     Auto-tracking is off so the pageview can be sent with a normalized path.
     /publications, /publications/ and /publications.html are the same page and
     would otherwise be counted as three. -->
<script defer src="https://cloud.umami.is/script.js"
        data-website-id="7712edc8-2c79-45ce-a0ea-d855067aa17e"
        data-auto-track="false"></script>
<script>
  addEventListener("load", function () {
    if (!window.umami) return;          // blocked, or offline
    var p = location.pathname.replace(/\.html$/, "").replace(/\/+$/, "") || "/";
    umami.track(function (props) { return Object.assign({}, props, { url: p }); });
  });
</script>
</body>
