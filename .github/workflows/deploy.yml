name: Deploy site

# The site is static: no Jekyll, no bundler, no plugins. The only build step
# is regenerating publications.html from _bibliography/papers.bib, so the bib
# stays the single source of truth and cannot drift from the rendered page.
#
# Publishes to the gh-pages branch, the same target the previous al-folio
# workflow used, so no repository Pages setting needs to change.

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "publications.html"
      - "assets/**"
      - "tools/**"
      - "_bibliography/**"
      - "_data/coauthors.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rebuild publications 📚
        run: python3 tools/build-publications.py

      - name: Fail if publications.html is stale 🔍
        run: |
          if ! git diff --quiet -- publications.html; then
            echo "publications.html does not match _bibliography/papers.bib."
            echo "Run: python3 tools/build-publications.py — then commit the result."
            git diff --stat -- publications.html
            exit 1
          fi

      - name: Assemble site 🔧
        run: |
          mkdir -p _site
          cp index.html publications.html _site/
          cp -r assets _site/assets
          # tell GitHub Pages to serve these files as-is
          touch _site/.nojekyll

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
